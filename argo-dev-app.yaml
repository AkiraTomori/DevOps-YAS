apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: yas-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/AkiraTomori/DevOps-YAS.git'
    targetRevision: main  # Theo dõi nhánh main
    path: k8s/env-dev     # Thư mục chứa cấu hình dev
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: dev        # Tự động deploy vào namespace dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true