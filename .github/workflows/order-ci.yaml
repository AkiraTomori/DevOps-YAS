name: order service ci

on:
  push:
    branches:
      - "main"
      - "feature/order**"  # Chỉ chạy khi push lên feature/order, feature/order-*, etc.
    paths:
      - "order/**"
      - ".github/workflows/actions/action.yaml"
      - ".github/workflows/order-ci.yaml"
      - "pom.xml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "order/**"
      - ".github/workflows/actions/action.yaml"
      - ".github/workflows/order-ci.yaml"
      - "pom.xml"
  workflow_dispatch:  # Cho phép chạy thủ công nếu cần

permissions:
  contents: read
  pull-requests: write
  checks: write
  packages: write

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Setup Environment
        uses: ./.github/workflows/actions

      # 1. Gitleaks: Kiểm tra lộ Secret (Yêu cầu 7c)
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true 
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. Build & Install: Cài đặt library dùng chung và build order (skip IT để tránh phụ thuộc Docker/Testcontainers ở job unit-ci)
      - name: Run Maven Install
        run: mvn clean install -pl order -am -DskipITs

      # 3. Unit test: chạy riêng để xuất báo cáo surefire ổn định
      - name: Run Maven Unit Tests
        run: |
          mvn test -pl order -am \
          org.jacoco:jacoco-maven-plugin:0.8.11:check \
          -Djacoco.check.line.coveredRatio=0.70 \
          -Djacoco.check.branch.coveredRatio=0.70

      # 4. Snyk: Quét bảo mật dependencies (Yêu cầu 7c)
      - name: Setup Snyk CLI
        uses: snyk/actions/setup@master

      - name: Snyk Security Scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test -d --file=order/pom.xml --org=akiratomori --severity-threshold=high --command=mvn
        continue-on-error: true

      # 5. SonarCloud: Quét chất lượng code (Yêu cầu 7c)
      - name: Analyze with Sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
          -pl order -am \
          -Dsonar.organization=akiratomori-2 \
          -Dsonar.projectKey=AkiraTomori_DevOps-YAS

      # 6. Kiểm tra độ phủ Testcase > 80% (Yêu cầu 7b)
      - name: Check Coverage Report
        uses: madrapps/jacoco-report@v1.6.1
        with:
          paths: ${{github.workspace}}/order/target/site/jacoco/jacoco.xml
          token: ${{secrets.GITHUB_TOKEN}}
          min-coverage-overall: 70
          title: 'Order Service Coverage Report'
          update-comment: true
          continue-on-error: false
        continue-on-error: false
      
      # Upload báo cáo coverage để tham chiếu sau (Yêu cầu 7b)
      - name: Archive Order Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: order-service-coverage-report
          path: order/target/site/jacoco/

      # 7. Upload kết quả Test (Yêu cầu 5)
      - name: Unit Test Results
        uses: dorny/test-reporter@v1
        if: ${{ always() }}
        with:
          name: Order-Service-Unit-Test-Results
          path: "order/target/surefire-reports/*.xml"
          reporter: java-junit

      # 8. Docker Build & Push (Yêu cầu 3)
      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v6
        with:
          context: ./order
          push: true
          tags: ghcr.io/akiratomori/devops-yas-ga/yas-order:latest