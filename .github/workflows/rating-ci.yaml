name: rating service ci

on:
  push:
    branches:
      - "main"
      - "feature/rating**"
    paths:
      - "rating/**"
      - ".github/workflows/actions/action.yaml"
      - ".github/workflows/rating-ci.yaml"
      - "pom.xml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "rating/**"
      - ".github/workflows/actions/action.yaml"
      - ".github/workflows/rating-ci.yaml"
      - "pom.xml"
  workflow_dispatch: # Cho phép chạy thủ công nếu cần

permissions:
  contents: read
  pull-requests: write
  checks: write
  packages: write

jobs:
  # PHASE 1: TEST & QUALITY SCAN
  Test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Setup Environment
        uses: ./.github/workflows/actions

      # 1. Gitleaks: Quét Secret
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true 
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. Build & Install: Skip toàn bộ Test để chuẩn bị môi trường nhanh
      - name: Run Maven Install
        run: mvn clean install -pl rating -am -DskipTests -DskipITs

      # 3. Unit Test: Chỉ chạy Unit Test và xuất báo cáo JaCoCo
      - name: Run Maven Unit Tests
        run: mvn test -pl rating -am jacoco:report -DskipITs

      # 4. Snyk: Quét bảo mật Dependencies
      - name: Setup Snyk CLI
        uses: snyk/actions/setup@master

      - name: Snyk Security Scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test -d --file=rating/pom.xml --org=akiratomori --severity-threshold=high --command=mvn
        continue-on-error: true

      # 5. SonarCloud: Quét chất lượng code
      - name: Analyze with Sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
          -pl rating -am \
          -Dsonar.organization=akiratomori-2 \
          -Dsonar.projectKey=AkiraTomori_DevOps-YAS

      # 6. Kiểm tra độ phủ Unit Test > 70%
      - name: Check Coverage Report
        uses: madrapps/jacoco-report@v1.6.1
        with:
          paths: ${{github.workspace}}/rating/target/site/jacoco/jacoco.xml
          token: ${{secrets.GITHUB_TOKEN}}
          min-coverage-overall: 70 
          title: 'Rating Service Coverage Report'
          update-comment: true
          continue-on-error: false
        continue-on-error: false

      # Upload báo cáo coverage để tham chiếu sau (Yêu cầu 7b)
      - name: Archive Rating Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: rating-service-coverage-report
          path: rating/target/site/jacoco/

      # 7. Upload kết quả Test (Yêu cầu 5)
      - name: Unit Test Results
        uses: dorny/test-reporter@v1
        if: ${{ always() }}
        with:
          name: Rating-Service-Unit-Test-Results
          path: "rating/target/surefire-reports/*.xml"
          reporter: java-junit

  # PHASE 2: BUILD & PUSH DOCKER (Chỉ chạy khi PR vào main và Phase Test thành công)
  Build:
    needs: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/workflows/actions

      - name: Build Package
        run: mvn clean package -pl rating -am -DskipTests -DskipITs -Dcheckstyle.skip

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./rating
          push: true
          tags: ghcr.io/akiratomori/devops-yas-ga/yas-rating:latest
