name: developer_build

on:
  workflow_dispatch:
    inputs:
      cart_branch:
        description: "Branch for cart service"
        required: true
        default: "main"
      customer_branch:
        description: "Branch for customer service"
        required: true
        default: "main"
      inventory_branch:
        description: "Branch for inventory service"
        required: true
        default: "main"
      location_branch:
        description: "Branch for location service"
        required: true
        default: "main"
      media_branch:
        description: "Branch for media service"
        required: true
        default: "main"
      order_branch:
        description: "Branch for order service"
        required: true
        default: "main"
      product_branch:
        description: "Branch for product service"
        required: true
        default: "main"
      rating_branch:
        description: "Branch for rating service"
        required: true
        default: "main"
      search_branch:
        description: "Branch for search service"
        required: true
        default: "main"
      tax_branch:
        description: "Branch for tax service"
        required: true
        default: "main"

jobs:
  developer-build:
    name: Developer Build And Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Cần thiết để authenticate với GCP
    env:
      NAMESPACE: yas
      DEFAULT_TAG: latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Xác thực với GCP bằng Service Account Key
      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      # 2. Thiết lập cấu hình GKE (Thay thế bước cấu hình Kubeconfig thủ công)
      - name: 'Set up GKE credentials'
        uses: 'google-github-actions/get-gke-credentials@v2'
        with:
          cluster_name: 'yas-heavy-cluster'
          location: 'asia-southeast1-a'

      # 3. Resolve image tags (Chuyển sang Bash)
      - name: Resolve image tags
        id: resolve
        run: |
          resolve_tag() {
            local branch=$1
            if [[ "$branch" == "main" || "$branch" == "latest" ]]; then
              echo "$DEFAULT_TAG"
            else
              # Lấy SHA ngắn gọn của branch từ remote
              local sha=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
              if [ -z "$sha" ]; then echo "Error: Branch $branch not found"; exit 1; fi
              echo "${sha:0:7}"
            fi
          }
          
          echo "cart_tag=$(resolve_tag ${{ github.event.inputs.cart_branch }})" >> $GITHUB_OUTPUT
          echo "tax_tag=$(resolve_tag ${{ github.event.inputs.tax_branch }})" >> $GITHUB_OUTPUT
          echo "product_tag=$(resolve_tag ${{ github.event.inputs.product_branch }})" >> $GITHUB_OUTPUT
          echo "customer_tag=$(resolve_tag ${{ github.event.inputs.customer_branch }})" >> $GITHUB_OUTPUT
          echo "inventory_tag=$(resolve_tag ${{ github.event.inputs.inventory_branch }})" >> $GITHUB_OUTPUT
          echo "location_tag=$(resolve_tag ${{ github.event.inputs.location_branch }})" >> $GITHUB_OUTPUT
          echo "media_tag=$(resolve_tag ${{ github.event.inputs.media_branch }})" >> $GITHUB_OUTPUT
          echo "order_tag=$(resolve_tag ${{ github.event.inputs.order_branch }})" >> $GITHUB_OUTPUT
          echo "rating_tag=$(resolve_tag ${{ github.event.inputs.rating_branch }})" >> $GITHUB_OUTPUT
          echo "search_tag=$(resolve_tag ${{ github.event.inputs.search_branch }})" >> $GITHUB_OUTPUT

      # 4. Deploy yas-configuration
      - name: Deploy shared configuration
        run: |
          helm dependency build k8s/charts/yas-configuration
          helm upgrade --install yas-configuration k8s/charts/yas-configuration \
            --namespace $NAMESPACE --create-namespace

      # 5. Hàm Deploy Service
      - name: Deploy selected service images
        run: |
          deploy_svc() {
            local svc=$1
            local tag=$2
            echo "--- Deploying $svc with tag $tag ---"
            helm dependency build k8s/charts/$svc
            helm upgrade --install $svc k8s/charts/$svc \
              --namespace $NAMESPACE \
              --set "backend.image.tag=$tag" \
              --set "backend.service.type=NodePort" \
              --set "common.monitoring.enabled=false" \
              --set "monitoring.enabled=false" \
              --set "serviceMonitor.enabled=false"
            
            kubectl rollout status deployment/$svc -n $NAMESPACE --timeout=120s
          }

          deploy_svc "cart" "${{ steps.resolve.outputs.cart_tag }}"
          deploy_svc "tax" "${{ steps.resolve.outputs.tax_tag }}"
          deploy_svc "product" "${{ steps.resolve.outputs.product_tag }}"
          deploy_svc "customer" "${{ steps.resolve.outputs.customer_tag }}"
          deploy_svc "inventory" "${{ steps.resolve.outputs.inventory_tag }}"
          deploy_svc "location" "${{ steps.resolve.outputs.location_tag }}"
          deploy_svc "media" "${{ steps.resolve.outputs.media_tag }}"
          deploy_svc "order" "${{ steps.resolve.outputs.order_tag }}"
          deploy_svc "rating" "${{ steps.resolve.outputs.rating_tag }}"
          deploy_svc "search" "${{ steps.resolve.outputs.search_tag }}"

      # 6. Publish Summary (Định dạng Markdown chuẩn)
      - name: Publish deploy summary
        if: always()
        run: |
          NODE_IP=$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="ExternalIP")].address}')
          
          echo "## Developer Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Namespace**: \`$NAMESPACE\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Node IP**: \`$NODE_IP\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Action**: Add to hosts: \`$NODE_IP api.yas.local.com\`" >> $GITHUB_STEP_SUMMARY
          echo "### NodePort Endpoints" >> $GITHUB_STEP_SUMMARY
          
          for svc in cart tax product customer inventory location media order rating search; do
            PORT=$(kubectl get svc $svc -n $NAMESPACE -o jsonpath='{.spec.ports[0].nodePort}' 2>/dev/null || echo "")
            if [ ! -z "$PORT" ]; then
              echo "- **$svc**: [http://api.yas.local.com:$PORT](http://api.yas.local.com:$PORT)" >> $GITHUB_STEP_SUMMARY
            else
              echo "- **$svc**: Deploy failed" >> $GITHUB_STEP_SUMMARY
            fi
          done