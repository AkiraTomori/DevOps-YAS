name: developer_build

on:
  workflow_dispatch:
    inputs:
      cart_branch:
        description: "Branch for cart service"
        required: true
        default: "main"
      customer_branch:
        description: "Branch for customer service"
        required: true
        default: "main"
      inventory_branch:
        description: "Branch for inventory service"
        required: true
        default: "main"
      location_branch:
        description: "Branch for location service"
        required: true
        default: "main"
      media_branch:
        description: "Branch for media service"
        required: true
        default: "main"
      order_branch:
        description: "Branch for order service"
        required: true
        default: "main"
      product_branch:
        description: "Branch for product service"
        required: true
        default: "main"
      rating_branch:
        description: "Branch for rating service"
        required: true
        default: "main"
      search_branch:
        description: "Branch for search service"
        required: true
        default: "main"
      tax_branch:
        description: "Branch for tax service"
        required: true
        default: "main"

jobs:
  developer-build:
    name: Developer Build And Deploy
    runs-on: self-hosted
    permissions:
      contents: read
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      NAMESPACE: yas
      DEFAULT_TAG: latest 
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # - name: Setup Helm
      #   uses: azure/setup-helm@v4

      # - name: Setup kubectl
      #   uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"

          if echo "$KUBE_CONFIG" | grep -q "apiVersion:"; then
            printf '%s' "$KUBE_CONFIG" > "$HOME/.kube/config"
          else
            printf '%s' "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          fi

          chmod 600 "$HOME/.kube/config"
          kubectl get nodes

      - name: Resolve image tags from branch inputs
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          resolve_tag() {
            local branch="$1"
            if [ "$branch" = "main" ] || [ "$branch" = "latest" ]; then
              echo "$DEFAULT_TAG"
              return
            fi

            local sha
            sha=$(git ls-remote origin "refs/heads/$branch" | awk '{print $1}')
            if [ -z "$sha" ]; then
              echo "ERROR: Cannot resolve branch '$branch' on remote origin" >&2
              exit 1
            fi
            echo "$sha"
          }

          echo "cart_tag=$(resolve_tag "${{ inputs.cart_branch }}")" >> "$GITHUB_OUTPUT"
          echo "customer_tag=$(resolve_tag "${{ inputs.customer_branch }}")" >> "$GITHUB_OUTPUT"
          echo "inventory_tag=$(resolve_tag "${{ inputs.inventory_branch }}")" >> "$GITHUB_OUTPUT"
          echo "location_tag=$(resolve_tag "${{ inputs.location_branch }}")" >> "$GITHUB_OUTPUT"
          echo "media_tag=$(resolve_tag "${{ inputs.media_branch }}")" >> "$GITHUB_OUTPUT"
          echo "order_tag=$(resolve_tag "${{ inputs.order_branch }}")" >> "$GITHUB_OUTPUT"
          echo "product_tag=$(resolve_tag "${{ inputs.product_branch }}")" >> "$GITHUB_OUTPUT"
          echo "rating_tag=$(resolve_tag "${{ inputs.rating_branch }}")" >> "$GITHUB_OUTPUT"
          echo "search_tag=$(resolve_tag "${{ inputs.search_branch }}")" >> "$GITHUB_OUTPUT"
          echo "tax_tag=$(resolve_tag "${{ inputs.tax_branch }}")" >> "$GITHUB_OUTPUT"

      - name: Deploy selected service images
        shell: bash
        run: |
          set -euo pipefail

          deploy_service() {
            local service="$1"
            local tag="$2"

            if [ -d "k8s/charts/$service" ]; then
              helm dependency build "k8s/charts/$service"
              helm upgrade --install "$service" "k8s/charts/$service" \
                --namespace "$NAMESPACE" \
                --create-namespace \
                --set "backend.image.repository=$DOCKERHUB_USERNAME/yas-$service" \
                --set "backend.image.tag=$tag" \
                --set "backend.service.type=NodePort"

              kubectl rollout status deployment/"$service" -n "$NAMESPACE" --timeout=180s
            else
              echo "Warning: Chart for $service not found in k8s/charts/$service"
            fi
          }

          deploy_service cart "${{ steps.resolve.outputs.cart_tag }}"
          deploy_service customer "${{ steps.resolve.outputs.customer_tag }}"
          deploy_service inventory "${{ steps.resolve.outputs.inventory_tag }}"
          deploy_service location "${{ steps.resolve.outputs.location_tag }}"
          deploy_service media "${{ steps.resolve.outputs.media_tag }}"
          deploy_service order "${{ steps.resolve.outputs.order_tag }}"
          deploy_service product "${{ steps.resolve.outputs.product_tag }}"
          deploy_service rating "${{ steps.resolve.outputs.rating_tag }}"
          deploy_service search "${{ steps.resolve.outputs.search_tag }}"
          deploy_service tax "${{ steps.resolve.outputs.tax_tag }}"

      - name: Publish deploy summary (NodePort)
        shell: bash
        run: |
          set -euo pipefail

          # Lấy IP của Worker Node trong cụm
          NODE_IP=$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}')
          if [ -z "$NODE_IP" ]; then
            NODE_IP="<worker-node-ip>"
          fi

          {
            echo "## Developer_build summary"
            echo ""
            echo "**Node IP**: \`$NODE_IP\`"
            echo ""
            echo "🔧 **Action required**: Add hosts entry on your machine:"
            echo "\`$NODE_IP yas.local\`"
            echo ""
            echo "### Resolved image tags"
            echo "- cart: \`${{ steps.resolve.outputs.cart_tag }}\`"
            echo "- customer: \`${{ steps.resolve.outputs.customer_tag }}\`"
            echo "- inventory: \`${{ steps.resolve.outputs.inventory_tag }}\`"
            echo "- location: \`${{ steps.resolve.outputs.location_tag }}\`"
            echo "- media: \`${{ steps.resolve.outputs.media_tag }}\`"
            echo "- order: \`${{ steps.resolve.outputs.order_tag }}\`"
            echo "- product: \`${{ steps.resolve.outputs.product_tag }}\`"
            echo "- rating: \`${{ steps.resolve.outputs.rating_tag }}\`"
            echo "- search: \`${{ steps.resolve.outputs.search_tag }}\`"
            echo "- tax: \`${{ steps.resolve.outputs.tax_tag }}\`"
            echo ""
            echo "### NodePort endpoints"
          } >> "$GITHUB_STEP_SUMMARY"

          for svc in cart customer inventory location media order product rating search tax; do
            port=$(kubectl get svc "$svc" -n "$NAMESPACE" -o jsonpath='{.spec.ports[0].nodePort}' 2>/dev/null || echo "")
            if [ -z "$port" ]; then
              echo "- $svc: NodePort not found" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- $svc: http://yas.local:$port" >> "$GITHUB_STEP_SUMMARY"
            fi
          done