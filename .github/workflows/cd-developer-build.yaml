name: developer_build

on:
  workflow_dispatch:
    inputs:
      cart_branch:
        description: "Branch for cart service"
        required: true
        default: "main"
      customer_branch:
        description: "Branch for customer service"
        required: true
        default: "main"
      inventory_branch:
        description: "Branch for inventory service"
        required: true
        default: "main"
      location_branch:
        description: "Branch for location service"
        required: true
        default: "main"
      media_branch:
        description: "Branch for media service"
        required: true
        default: "main"
      order_branch:
        description: "Branch for order service"
        required: true
        default: "main"
      product_branch:
        description: "Branch for product service"
        required: true
        default: "main"
      rating_branch:
        description: "Branch for rating service"
        required: true
        default: "main"
      search_branch:
        description: "Branch for search service"
        required: true
        default: "main"
      tax_branch:
        description: "Branch for tax service"
        required: true
        default: "main"

jobs:
  developer-build:
    name: Developer Build And Deploy
    runs-on: self-hosted
    # Thiết lập shell mặc định là powershell cho toàn bộ các bước bên dưới
    defaults:
      run:
        shell: powershell 
    permissions:
      contents: read
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      NAMESPACE: yas
      DEFAULT_TAG: latest 
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure kubeconfig
        shell: powershell
        env:
          KUBE_RAW: ${{ secrets.KUBE_CONFIG }}
        run: |
          # 1. Tạo file config tạm ngay tại thư mục Workspace của Job
          $localConfig = Join-Path $pwd "runner-kubeconfig"
          $data = $env:KUBE_RAW.Trim()

          if ($data -match "apiVersion:") {
              [System.IO.File]::WriteAllText($localConfig, $data, [System.Text.Encoding]::UTF8)
          } else {
              $cleanBase64 = $data -replace '\s',''
              $bytes = [System.Convert]::FromBase64String($cleanBase64)
              [System.IO.File]::WriteAllBytes($localConfig, $bytes)
          }

          # 2. THIẾT LẬP QUAN TRỌNG: Ép các bước sau dùng file này
          echo "KUBECONFIG=$localConfig" >> $env:GITHUB_ENV
          
          Write-Host "Kubeconfig is isolated at: $localConfig"
          # Đợi 1 giây để biến môi trường được cập nhật
          Start-Sleep -s 1
          kubectl get nodes
        
      - name: Resolve image tags from branch inputs
        id: resolve
        run: |
          # Chuyển logic shell sang PowerShell để tương thích 100% với Windows Runner
          function Resolve-Tag($branch) {
              if ($branch -eq "main" -or $branch -eq "latest") { return $env:DEFAULT_TAG }
              $sha = (git ls-remote origin "refs/heads/$branch" | ForEach-Object { $_.Split("`t")[0] })
              if (-not $sha) { 
                  Write-Error "Cannot resolve branch '$branch'"
                  exit 1 
              }
              return $sha
          }

          echo "cart_tag=$(Resolve-Tag '${{ inputs.cart_branch }}')" >> $env:GITHUB_OUTPUT
          echo "customer_tag=$(Resolve-Tag '${{ inputs.customer_branch }}')" >> $env:GITHUB_OUTPUT
          echo "inventory_tag=$(Resolve-Tag '${{ inputs.inventory_branch }}')" >> $env:GITHUB_OUTPUT
          echo "location_tag=$(Resolve-Tag '${{ inputs.location_branch }}')" >> $env:GITHUB_OUTPUT
          echo "media_tag=$(Resolve-Tag '${{ inputs.media_branch }}')" >> $env:GITHUB_OUTPUT
          echo "order_tag=$(Resolve-Tag '${{ inputs.order_branch }}')" >> $env:GITHUB_OUTPUT
          echo "product_tag=$(Resolve-Tag '${{ inputs.product_branch }}')" >> $env:GITHUB_OUTPUT
          echo "rating_tag=$(Resolve-Tag '${{ inputs.rating_branch }}')" >> $env:GITHUB_OUTPUT
          echo "search_tag=$(Resolve-Tag '${{ inputs.search_branch }}')" >> $env:GITHUB_OUTPUT
          echo "tax_tag=$(Resolve-Tag '${{ inputs.tax_branch }}')" >> $env:GITHUB_OUTPUT

      - name: Deploy selected service images
        run: |
          function Deploy-Service($service, $tag) {
              $chartPath = "k8s/charts/$service"
              if (Test-Path $chartPath) {
                  Write-Host "Deploying $service with tag $tag..."
                  helm dependency build $chartPath
                  helm upgrade --install $service $chartPath `
                    --namespace $env:NAMESPACE `
                    --create-namespace `
                    --set "backend.image.repository=$($env:DOCKERHUB_USERNAME)/yas-$service" `
                    --set "backend.image.tag=$tag" `
                    --set "backend.service.type=NodePort"

                  kubectl rollout status deployment/$service -n $env:NAMESPACE --timeout=180s
              } else {
                  Write-Warning "Chart for $service not found."
              }
          }

          Deploy-Service "cart" "${{ steps.resolve.outputs.cart_tag }}"
          Deploy-Service "customer" "${{ steps.resolve.outputs.customer_tag }}"
          Deploy-Service "inventory" "${{ steps.resolve.outputs.inventory_tag }}"
          Deploy-Service "location" "${{ steps.resolve.outputs.location_tag }}"
          Deploy-Service "media" "${{ steps.resolve.outputs.media_tag }}"
          Deploy-Service "order" "${{ steps.resolve.outputs.order_tag }}"
          Deploy-Service "product" "${{ steps.resolve.outputs.product_tag }}"
          Deploy-Service "rating" "${{ steps.resolve.outputs.rating_tag }}"
          Deploy-Service "search" "${{ steps.resolve.outputs.search_tag }}"
          Deploy-Service "tax" "${{ steps.resolve.outputs.tax_tag }}"

      - name: Publish deploy summary
        run: |
          $NODE_IP = (kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}')
          if (-not $NODE_IP) { $NODE_IP = "<worker-node-ip>" }

          "## Developer_build summary" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "**Node IP**: ``$NODE_IP``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "🔧 **Action required**: Add hosts entry: ``$NODE_IP yas.local``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "### NodePort endpoints" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

          $services = "cart", "customer", "inventory", "location", "media", "order", "product", "rating", "search", "tax"
          foreach ($svc in $services) {
              $port = (kubectl get svc $svc -n $env:NAMESPACE -o jsonpath='{.spec.ports[0].nodePort}' 2>$null)
              if ($port) {
                  "- $svc: http://yas.local:$port" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              } else {
                  "- $svc: Not found" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              }
          }