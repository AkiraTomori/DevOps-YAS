name: developer_cleanup

on:
  workflow_dispatch: # Tạo nút bấm dọn dẹp thủ công

jobs:
  cleanup:
    name: Cleanup Developer Environment
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to GCP
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Get GKE Credentials
        uses: 'google-github-actions/get-gke-credentials@v2'
        with:
          cluster_name: 'yas-heavy-cluster'
          location: 'asia-southeast1-a'

      - name: Uninstall Helm Releases
        run: |
          # Danh sách các service đã deploy ở bước 4
          SERVICES="cart customer inventory location media order product rating search tax"
          
          for svc in $SERVICES; do
            echo "--- Checking and uninstalling $svc ---"
            # Lệnh helm uninstall sẽ xóa sạch Deployment, Service, NodePort của service đó
            helm uninstall $svc -n yas || echo "$svc was not found, skipping."
          done

      - name: Summary
        run: echo "Dọn dẹp hoàn tất! Các tài nguyên tạm thời đã được giải phóng khỏi GKE." >> $GITHUB_STEP_SUMMARY